<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원정보</title>
    <link rel="stylesheet" href="/css/info.css">
</head>
<body>
<header th:replace="~{layout/header :: header}"></header>

<main>
    <!-- 구매 카드 리스트 -->
    <div class="buy-list-container">
        <h2>구매한 카드 리스트</h2>

        <div th:if="${#lists.isEmpty(buyLists)}">
            구매한 카드가 없습니다.
        </div>

        <div class="wallet" th:if="${!#lists.isEmpty(buyLists)}">
            <div th:each="card : ${buyLists}" class="wallet-card">
                <img th:src="${card.card_image}" alt="카드 이미지" />
                <div class="card-info">
                    <p th:text="${card.card_name}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 회원정보 -->
    <div class="container">
        <h1>회원정보</h1>
        <div class="info-item" th:text="${loggedMember.userID}">아이디</div>
        <div class="info-item" th:text="${loggedMember.userName}">이름</div>
        <div class="info-item" th:text="${loggedMember.userEmail}">이메일</div>
        <div class="info-item" th:text="${loggedMember.phone}">핸드폰번호</div>
        <div class="info-item" th:text="${loggedMember.address}">주소</div>

        <div class="actions">
            <a th:href="@{/member/delete}">회원탈퇴</a>
            <a th:href="@{/member/edit}">정보수정</a>
            <a th:href="@{/member/change-password}">비밀번호수정</a>
        </div>
    </div>
</main>

<footer th:replace="layout/footer :: footer"></footer>

<script>
    const wallet = document.querySelector('.wallet');

    if (wallet) {
        wallet.addEventListener('wheel', (e) => {
            e.preventDefault();
            wallet.scrollLeft += e.deltaY; // 마우스 휠로 좌우 이동
        });
    }
</script>
</body>
</html>
