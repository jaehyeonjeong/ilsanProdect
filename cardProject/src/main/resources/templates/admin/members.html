<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 관리</title>
    <link href="/css/members.css" rel="stylesheet">
</head>

<body>
<header th:replace="~{layout/header :: header}"></header>

<main class="container">
    <h1>회원 관리</h1>

    <!-- 검색 -->
    <form th:action="@{/admin/members}" method="get" class="search-form">
        <input type="text" name="keyword"
               th:value="${keyword}"
               placeholder="아이디 검색"/>
        <button type="submit">검색</button>
    </form>

    <!-- 테이블 -->
    <div class="table-wrapper">
        <table class="members-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>아이디</th>
                <th>이메일</th>
                <th>이름</th>
                <th>전화번호</th>
                <th>권한</th>
                <th>관리</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="member : ${members.content}">
                <td th:text="${member.id}"></td>
                <td th:text="${member.userID}"></td>
                <td th:text="${member.userEmail}"></td>
                <td th:text="${member.userName}"></td>
                <td th:text="${member.phone}"></td>
                <td>
                    <span class="role-label" th:text="${member.role}"></span>
                </td>
                <td>
                    <a th:href="@{/admin/members/delete/{id}(id=${member.id})}"
                       onclick="return confirm('정말 삭제하시겠습니까?');"
                       class="delete-btn">
                        삭제
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination">
        <!-- 이전 -->
        <span th:if="${currentPage == 0}" class="btn-disabled">이전</span>
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/members(page=${currentPage - 1}, keyword=${keyword})}">이전</a>

        <!-- 페이지 번호 -->
        <span th:each="i : ${#numbers.sequence(startPage, endPage)}">
            <span th:if="${i == currentPage}" class="btn-active" th:text="${i + 1}"></span>
            <a th:if="${i != currentPage}"
               th:href="@{/admin/members(page=${i}, keyword=${keyword})}"
               th:text="${i + 1}"></a>
        </span>

        <!-- 다음 -->
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/admin/members(page=${currentPage + 1}, keyword=${keyword})}">다음</a>
        <span th:if="${currentPage >= totalPages - 1}" class="btn-disabled">다음</span>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
