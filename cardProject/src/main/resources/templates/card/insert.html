<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카드 정보 입력</title>
    <link rel="stylesheet" href="/css/insert.css">

</head>
<body>
<!-- Header -->
<header th:replace="~{layout/header :: header}"></header>
<form action="../card/insert" method="post" th:object="${cardDto}"
      enctype="multipart/form-data">
<!--    카드 이름-->
    <div><span>카드 이름 : </span><input type="text" th:field="*{name}"></div>
    <div th:if="${#fields.hasErrors('name')}"
         th:errors="*{name}"
         style="color:red">
    </div>
<!--    카드 타입 (콤보박스 형태로 입력)-->
    <div>
        <label for="cate">카드 타입 :</label>
        <select name="cate" id="cate" th:field="*{cate}">
            <th:block th:each="cate : ${cateEnum}">
                <option th:value="${cate.initial}" th:text="${cate.initial}"></option>
            </th:block>
        </select>
    </div>
<!--카드 연회비-->
    <div><span>카드 연회비 : </span><input type="text" th:field="*{annual}"></div>
    <div th:if="${#fields.hasErrors('annual')}"
         th:errors="*{annual}"
         style="color:red">
    </div>
<!--    카드 실적-->
    <div><span>카드 실적 : </span><input type="text" th:field="*{pre}"></div>
    <div th:if="${#fields.hasErrors('pre')}"
         th:errors="*{pre}"
         style="color:red">
    </div>
<!--    카드 회사-->
    <div>
        <label for="corp">카드 회사 :</label>
        <select name="corp" id="corp" th:field="*{corp}">
            <th:block th:each="corp : ${corpEnum}">
                <option th:value="${corp.name}" th:text="${corp.name}"></option>
            </th:block>
        </select>
    </div>
<!--    카드 이미지 저장-->
    <div>
        <span>PROFILE</span>
        <input type="file" th:field="*{cardImage}" onchange="previewImage(event)">
    </div>
    <!-- 이미지 미리보기 영역 -->
    <div id="imagePreview" style="margin-top:10px;">
        <img id="preview" src="#" alt="이미지 미리보기" style="max-width:300px; display:none;">
    </div>
    <div><button onclick="showToast()">카드 정보 입력</button></div>

</form>
<!-- Footer -->
<footer th:replace="~{layout/footer :: footer}"></footer>

<div id="toast" class="toast toast-end"
     th:if="${failMessage}"
     style="display:none;">
    <div class="alert alert-danger">
        <span th:text="${failMessage}"></span>
    </div>
</div>
</body>

<script>
    function previewImage(event) {
        const fileInput = event.target;
        const file = fileInput.files[0];

        // 파일명 표시
        // document.getElementById('fileNameText').textContent = file ? file.name : '';

        // 이미지 미리보기
        const preview = document.getElementById('preview');
        if (file && file.type.startsWith('image/')) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        } else {
            preview.src = '#';
            preview.style.display = 'none';
        }
    }

    window.onload = function() {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000); // 3초 후 자동 사라짐
        }
    };
</script>
</html>
