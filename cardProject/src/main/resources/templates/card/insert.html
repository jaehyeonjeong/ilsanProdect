<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카드 정보 입력</title>
</head>
<body>
<form action="../card/insert" method="post" th:object="${cardDto}"
      enctype="multipart/form-data">
<!--    카드 이름-->
    <div><span>카드 이름 : </span><input type="text" th:field="*{name}"></div>
<!--    카드 타입 (콤보박스 형태로 입력)-->
    <div>
        <label for="cate">카드 타입 :</label>
        <select name="cate" id="cate" th:field="*{cate}">
            <th:block th:each="cate : ${cateEnum}">
                <option th:value="${cate}" th:text="${cate.initial}"></option>
            </th:block>
        </select>
    </div>
<!--카드 연회비-->
    <div><span>카드 연회비 : </span><input type="text" th:field="*{annual}"></div>
<!--    카드 실적-->
    <div><span>카드 실적 : </span><input type="text" th:field="*{pre}"></div>
<!--    카드 회사-->
    <div>
        <label for="corp">카드 회사 :</label>
        <select name="corp" id="corp" th:field="*{corp}">
            <th:block th:each="corp : ${corpEnum}">
                <option th:value="${corp}" th:text="${corp.name}"></option>
            </th:block>
        </select>
    </div>
<!--    카드 이미지 저장-->
    <div>
        <span>PROFILE</span>
        <input type="file" th:field="*{cardImage}"/>
    </div>
    <div><button>카드 정보 입력</button></div>
</form>

</body>
</html>
