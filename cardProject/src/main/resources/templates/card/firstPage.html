<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1> Card Find First Page </h1>
<!-- 라디오 버튼 -->
<form id="cardForm" method="post" action="../card/firstPage">
    <fieldset>
        <legend>카드 카테고리 선택</legend>
        <label>
            <input type="radio" name="category" value="CRD"> 신용카드
        </label>
        <label>
            <input type="radio" name="category" value="CHK"> 체크카드
        </label>
    </fieldset>

    <!-- 체크박스 -->
    <fieldset>
        <legend> 카드 혜택 목록 </legend>
        <label>
            <input type="checkbox" name="benefit" value="주유"> 주유
        </label>
        <label>
            <input type="checkbox" name="benefit" value="통신"> 통신
        </label>
        <label>
            <input type="checkbox" name="benefit" value="쇼핑"> 쇼핑
        </label>
        <label>
            <input type="checkbox" name="benefit" value="푸드"> 푸드
        </label>
        <label>
            <input type="checkbox" name="benefit" value="카페"> 카페
        </label>
    </fieldset>
            <br>
    <input type="text" id="cardData" th:value="${countList}" placeholder="조회된 카드 갯수 표시" readonly>
</form>
<form method="get" action="../card/secondPage">
    <button type="submit">카드 리스트 조회</button>
</form>

</body>

<script>
    // 페이지 로드 시 저장값 복원
    window.onload = function () {
        // 저장된 값 복원
        const saveCategory = localStorage.getItem("category");
        if (saveCategory) {
            const radio = document.querySelector(`input[name="category"][value="${saveCategory}"]`);
            if (radio) radio.checked = true;
        }

        const savedBenefits = JSON.parse(localStorage.getItem("benefits") || "[]");
        savedBenefits.forEach(value => {
            const checkbox = document.querySelector(`input[name="benefit"][value="${value}"]`);
            if (checkbox) checkbox.checked = true;
        });
    };

    // 값 저장 (카테고리, 혜택, 카드조회 개수)
    document.querySelectorAll('input[name="category"]').forEach(radio => {
        radio.addEventListener("change", () => {
            localStorage.setItem("category", radio.value);
        });
    });

    document.querySelectorAll('input[name="benefit"]').forEach(checkbox => {
        checkbox.addEventListener("change", () => {
            const selected = Array.from(document.querySelectorAll('input[name="benefit"]:checked'))
                .map(cb => cb.value);
            localStorage.setItem("benefits", JSON.stringify(selected));
        });
    });


    // 체크박스 클릭 시 폼 자동 제
    document.querySelectorAll('input[name="benefit"]').forEach(checkbox => {
        checkbox.addEventListener("change", () => {
            const checkedBenefits = document.querySelectorAll('input[name="benefit"]:checked');
            if (checkedBenefits.length > 0) {
                document.getElementById("cardForm").submit();
            } else {
                document.getElementById("cardData").value = "0";
                // console.log("모든 체크박스가 해제되어 제출되지 않음");
            }
        });
    });


</script>


</html>
