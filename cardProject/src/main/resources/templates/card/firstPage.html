<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/css/firstPage.css">

</head>
<body>
<h1> Card Find First Page </h1>
<!-- 라디오 버튼 -->
<form id="cardForm" method="post" action="../card/firstPage">
    <fieldset>
        <legend>카드 카테고리 선택</legend>
        <label>
            <input type="radio" name="category" value="CRD" checked> 신용카드
        </label>
        <label>
            <input type="radio" name="category" value="CHK"> 체크카드
        </label>
    </fieldset>

    <!-- 체크박스 -->
    <fieldset>
        <legend> 카드 혜택 목록 </legend>
        <label>
            <input type="checkbox" name="benefit" value="주유"> 주유
        </label>
        <label>
            <input type="checkbox" name="benefit" value="통신"> 통신
        </label>
        <label>
            <input type="checkbox" name="benefit" value="쇼핑"> 쇼핑
        </label>
        <label>
            <input type="checkbox" name="benefit" value="푸드"> 푸드
        </label>
        <label>
            <input type="checkbox" name="benefit" value="카페"> 카페
        </label>
    </fieldset>
            <br>
    <input type="text" id="cardData" th:value="${countList}" placeholder="조회된 카드가 없습니다.." readonly>
</form>
<form method="get" action="../card/secondPage">
    <button type="submit" id="resetBtn">카드 리스트 조회</button>
</form>
</body>
<script src="/script/firstPage.js">
// 해당 스크립트 안 내무에서는 스크립트 동작이 안됨

</script>


</html>
