<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카드 정보</title>
</head>
<body>

<form th:action="@{/card/{id}/info(id=${cardInfoDto.id})}" method="post" >
    <!--    카드 이름-->
    <div style="font-size: 20px"> -- 카드 기본 정보 --</div>
    <div th:object="${cardInfoDto}">
        <input type="hidden" th:field="*{id}" />
        <div><span>카드 이름 : </span><input type="text" th:field="*{name}"></div>
        <div><span>카드 타입: </span><input type="text" th:field="*{cate}"></div>
        <div><span>카드 연회비 : </span><input type="text" th:field="*{annual}"></div>
        <div><span>카드 전원 실적 : </span><input type="text" th:field="*{pre}"></div>
        <div><span>카드 회사 : </span><input type="text" th:field="*{corp}"></div>
        <div><span>단종 여부 : </span><input type="checkbox" th:field="*{discontinue}"></div>
        <div><span>공유 여부 : </span><input type="checkbox" th:field="*{sharestate}"></div>
    </div>

    <div style="font-size: 20px"> -- 카드 결제 브랜드 정보 --</div>
    <div th:object="${cardBrandDto}">
        <input type="hidden" th:field="*{id}" />
        <div><span>visa 여부 : </span><input type=checkbox th:field="*{visa}"></div>
        <div><span>master 여부 : </span><input type="checkbox" th:field="*{master}"></div>
        <div><span>bc 여부 : </span><input type="checkbox" th:field="*{bc}"></div>
        <div><span>amex 여부 : </span><input type="checkbox" th:field="*{amex}"></div>
    </div>

    <div style="font-size: 20px"> -- 카드 혜택 정보 --</div>
    <div th:object="${cardBenefitDto}">
        <input type="hidden" th:field="*{id}" />
        <div><span>주유 여부 : </span><input type=checkbox th:field="*{fuel}"></div>
        <div><span>통신 여부 : </span><input type="checkbox" th:field="*{comm}"></div>
        <div><span>쇼핑 여부 : </span><input type="checkbox" th:field="*{shop}"></div>
        <div><span>식당 여부 : </span><input type="checkbox" th:field="*{food}"></div>
        <div><span>카페 여부 : </span><input type="checkbox" th:field="*{cafe}"></div>
    </div>

    <div><button>카드 정보 수정 및 등록</button></div>
</form>

</body>
</html>
